# Vercel deploys this site; this workflow only checks that every push and pull
# request still builds with no warnings (broken cross-references, quiz links,
# modules missing from content/course.js).
name: Build check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -- --strict

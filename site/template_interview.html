<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Network interview map · Career Tracks</title>
<meta name="description" content="The eleven topics of the network and connectivity interview, each linked to the sections, diagrams and model answers that cover it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
{{TOKENS}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:var(--accent)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.shell{display:grid;grid-template-columns:var(--side,340px) minmax(0,1fr);height:100%}

/* ---------- the map (left) ---------- */
.imap{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--surface)}
.imap-head{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand .mark{display:inline-flex;align-items:flex-end;gap:2px;height:18px}
.brand .mark i{width:4px;background:var(--accent);border-radius:1px}
.brand .mark i:nth-child(1){height:6px}.brand .mark i:nth-child(2){height:10px}.brand .mark i:nth-child(3){height:14px}.brand .mark i:nth-child(4){height:18px}
.brand b{font-size:15px;letter-spacing:-.01em}
.sub{margin:4px 0 10px;color:var(--ink-3);font-size:12.5px}
.prog{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-2)}
.prog .bar{flex:1;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:var(--entry);transition:width .25s}
.tools{display:flex;gap:6px;margin-top:10px}
.tools input{flex:1;min-width:0;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.tbtn{padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;white-space:nowrap;font-size:12.5px}
.tbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.topics{flex:1;overflow:auto;padding:6px 8px 24px;overscroll-behavior:contain}
.band{margin:14px 8px 6px;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);display:flex;justify-content:space-between}
.topic{border-radius:10px;margin:2px 0}
.topic.cur{background:var(--surface-2)}
.th{display:grid;grid-template-columns:28px minmax(0,1fr) auto 14px;align-items:center;gap:8px;width:100%;padding:8px;border:0;background:none;text-align:left;cursor:pointer;border-radius:10px}
.th:hover{background:var(--surface-2)}
.tn{display:grid;place-items:center;width:26px;height:26px;border-radius:7px;font:600 12.5px var(--mono);background:var(--accent-soft);color:var(--accent)}
.topic.req .tn{background:var(--accent);color:var(--accent-ink)}
.tt{font-weight:600}
.tt small{display:block;font-weight:400;color:var(--ink-3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc{font:500 11px var(--mono);color:var(--ink-3)}
.topic.full .tc{color:var(--entry)}
.chev{width:8px;height:8px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(-45deg);transition:transform .15s}
.th[aria-expanded="true"] .chev{transform:rotate(45deg)}
.tb{padding:0 6px 10px 44px}
.tb[hidden]{display:none}
.say{margin:2px 0 8px;padding:8px 10px;border-left:3px solid var(--say-line);background:var(--say-bg);border-radius:0 8px 8px 0;font-size:12.5px;color:var(--ink)}
.say b{display:block;font:600 10.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--mid);margin-bottom:2px}
.grp{margin:10px 0 2px;font:600 11px var(--mono);color:var(--ink-3);letter-spacing:.03em}
.tb ul,.final ul{list-style:none;margin:0;padding:0}
.it{display:grid;grid-template-columns:18px minmax(0,1fr) auto;align-items:center;gap:6px;padding:2px 4px;border-radius:7px}
.it:hover{background:var(--surface-2)}
.it.on{background:var(--accent-soft)}
.it.on a{color:var(--accent);font-weight:600}
.it input{margin:0;accent-color:var(--entry);cursor:pointer}
.it a{color:var(--ink);text-decoration:none;padding:3px 0;font-size:13px}
.it a:hover{color:var(--accent)}
.it.done a{color:var(--ink-3)}
.k{font:500 10px var(--mono);padding:1px 5px;border-radius:5px;background:var(--surface-3);color:var(--ink-2)}
.k.qa{background:var(--entry-soft);color:var(--entry)}
.k.deep{background:var(--mid-soft);color:var(--mid)}
.k.drill{background:var(--sota-bg);color:var(--sota-line)}
.final{margin:4px 0 0;padding:4px 6px 8px 12px}
.imap-foot{border-top:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px}
.imap-foot button{border:0;background:none;color:var(--ink-3);cursor:pointer;padding:0;text-decoration:underline}
.hidden-by-filter{display:none!important}
mark{background:var(--say-bg);color:inherit;border-radius:3px}

/* ---------- the reader (right) ---------- */
.view{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.vbar{display:flex;align-items:center;gap:8px;height:48px;padding:0 12px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 92%,transparent)}
.crumb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2);font-size:13px}
.crumb b{color:var(--ink)}
.crumb .cn{font:600 12px var(--mono);color:var(--accent);margin-right:6px}
.vbtn{display:inline-grid;place-items:center;min-width:32px;height:32px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;text-decoration:none;color:var(--ink);font-size:13px}
.vbtn:hover{border-color:var(--accent);color:var(--accent)}
.vbtn.tick[aria-pressed="true"]{background:var(--entry-soft);border-color:var(--entry);color:var(--entry)}
.menu{display:none}
iframe{flex:1;width:100%;border:0;background:var(--bg)}
.loading{position:absolute;inset:48px 0 0;display:grid;place-items:center;color:var(--ink-3);background:var(--bg);font-size:13px}
.loading[hidden]{display:none}
.keys-hint{font:500 11px var(--mono);color:var(--ink-3);margin-left:4px}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .imap{position:fixed;inset:0 auto 0 0;width:min(360px,88vw);z-index:20;transform:translateX(-102%);transition:transform .2s;box-shadow:var(--shadow)}
  body.open .imap{transform:none}
  body.open .view::after{content:"";position:absolute;inset:0;background:rgb(0 0 0 / .35);z-index:10}
  .menu{display:inline-grid}
  .keys-hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <aside class="imap" id="imap" aria-label="Interview topics">
    <div class="imap-head">
      <a class="brand" href="./" title="Open the full handbook"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><b>Network interview map</b></a>
      <p class="sub">11 topics from the hiring guide → the sections that cover them</p>
      <div class="prog"><span><b id="pDone">0</b> / <span id="pTot">0</span> reviewed</span><div class="bar"><i id="pBar"></i></div></div>
      <div class="tools">
        <input id="filter" type="search" placeholder="Filter: e.g. RAID, iDRAC, DHCP" aria-label="Filter topics and sections" autocomplete="off">
        <button class="tbtn" id="reqOnly" type="button" aria-pressed="false" title="Show only topics 1–5">1–5</button>
        <button class="tbtn" id="expandAll" type="button" title="Expand or collapse every topic">±</button>
        <button class="tbtn" id="theme" type="button" aria-label="Switch light or dark theme">◐</button>
      </div>
    </div>
    <nav class="topics" id="topics"></nav>
    <div class="imap-foot">
      <a href="./#m-N0" target="_top">Full handbook ↗</a>
      <a href="#quiz" id="quizLink">Self-test</a>
      <button type="button" id="resetTicks">Reset ticks</button>
    </div>
  </aside>
  <section class="view">
    <div class="vbar">
      <button class="vbtn menu" id="menu" type="button" aria-label="Show the topic list">☰</button>
      <div class="crumb" id="crumb">Pick a topic on the left</div>
      <span class="keys-hint" title="Keyboard: j / k next and previous, x tick, / filter">j k x /</span>
      <button class="vbtn" id="prev" type="button" aria-label="Previous section">◀</button>
      <button class="vbtn" id="next" type="button" aria-label="Next section">▶</button>
      <button class="vbtn tick" id="tick" type="button" aria-pressed="false" title="Mark this section reviewed (x)">✓</button>
      <a class="vbtn" id="openFull" href="./" target="_blank" rel="noopener" title="Open this section in the full handbook">↗</a>
    </div>
    <iframe id="frame" title="Handbook section"></iframe>
    <div class="loading" id="loading">Loading the handbook…</div>
  </section>
</div>
<script id="imap-data" type="application/json">{{DATA}}</script>
<script>
(function () {
  "use strict";
  const $ = s => document.querySelector(s);
  const DATA = JSON.parse($("#imap-data").textContent);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const KIND = { qa: "Q&A", deep: "deep", drill: "drill" };

  /* ---------- theme: shared with the handbook (ct:theme) ---------- */
  const root = document.documentElement;
  const theme = store.get("ct:theme", null);
  if (theme) root.setAttribute("data-theme", theme);
  $("#theme").addEventListener("click", () => {
    const dark = root.getAttribute("data-theme") === "dark" || (!root.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
    const next = dark ? "light" : "dark";
    root.setAttribute("data-theme", next); store.set("ct:theme", next);
    try { frame.contentDocument.documentElement.setAttribute("data-theme", next); } catch (e) {}
  });

  /* ---------- build the list ---------- */
  const items = [];            // flat reading order: {id, label, kind, topic}
  const byId = {};
  function itemHtml(it) {
    items.push(it);
    if (!byId[it.id]) byId[it.id] = it;
    return '<li class="it" data-i="' + (items.length - 1) + '"><input type="checkbox" aria-label="Reviewed: ' + esc(it.label) + '">' +
      '<a href="#' + esc(it.id) + '">' + esc(it.label) + "</a>" + (it.kind ? '<span class="k ' + it.kind + '">' + KIND[it.kind] + "</span>" : "<span></span>") + "</li>";
  }
  function topicHtml(T) {
    const t0 = items.length;
    const body = '<div class="say"><b>Core answer</b>' + esc(T.say) + "</div>" +
      T.groups.map(g => '<div class="grp">' + esc(g[0]) + "</div><ul>" +
        g[1].map(x => itemHtml({ id: x[1], label: x[0], kind: x[2] || "", topic: T })).join("") + "</ul>").join("");
    T.range = [t0, items.length];
    return '<section class="topic' + (T.required ? " req" : "") + '" id="t' + T.n + '" data-n="' + T.n + '">' +
      '<button class="th" type="button" aria-expanded="false"><span class="tn">' + T.n + '</span><span class="tt">' + esc(T.title) +
      "<small>" + esc(T.keys.join(" · ")) + '</small></span><span class="tc"></span><span class="chev" aria-hidden="true"></span></button>' +
      '<div class="tb" hidden>' + body + "</div></section>";
  }
  const FINAL_T = { n: "★", title: "Last hour before the interview", keys: [], required: false };
  let html = '<div class="band"><span>Required</span><span>1–5</span></div>';
  DATA.topics.forEach(T => {
    if (T.n === 6) html += '<div class="band extras"><span>Extras, good to have</span><span>6–11</span></div>';
    html += topicHtml(T);
  });
  html += '<div class="band extras"><span>Last hour</span><span>★</span></div><div class="final"><ul>' +
    DATA.final.map(x => itemHtml({ id: x[1], label: x[0], kind: x[2] || "", topic: FINAL_T })).join("") + "</ul></div>";
  $("#topics").innerHTML = html;
  $("#pTot").textContent = new Set(items.map(i => i.id)).size;

  /* ---------- reviewed ticks ---------- */
  let done = store.get("imap:done", {});
  function paintTicks() {
    document.querySelectorAll(".it").forEach(li => {
      const it = items[li.dataset.i];
      const on = !!done[it.id];
      li.classList.toggle("done", on);
      li.querySelector("input").checked = on;
    });
    DATA.topics.forEach(T => {
      const ids = [...new Set(items.slice(T.range[0], T.range[1]).map(i => i.id))];
      const n = ids.filter(id => done[id]).length;
      const el = document.getElementById("t" + T.n);
      el.querySelector(".tc").textContent = n + "/" + ids.length;
      el.classList.toggle("full", n === ids.length);
    });
    const all = [...new Set(items.map(i => i.id))];
    const n = all.filter(id => done[id]).length;
    $("#pDone").textContent = n;
    $("#pBar").style.width = (100 * n / all.length) + "%";
    if (cur >= 0) $("#tick").setAttribute("aria-pressed", !!done[items[cur].id]);
  }
  function toggleDone(id, v) {
    if (v === undefined) v = !done[id];
    if (v) done[id] = 1; else delete done[id];
    store.set("imap:done", done); paintTicks();
  }
  $("#topics").addEventListener("change", e => {
    const li = e.target.closest(".it");
    if (li) toggleDone(items[li.dataset.i].id, e.target.checked);
  });
  $("#resetTicks").addEventListener("click", () => { if (confirm("Clear every reviewed tick?")) { done = {}; store.set("imap:done", done); paintTicks(); } });

  /* ---------- expand and collapse ---------- */
  function setOpen(sec, open) {
    sec.querySelector(".th").setAttribute("aria-expanded", open);
    sec.querySelector(".tb").hidden = !open;
  }
  $("#topics").addEventListener("click", e => {
    const th = e.target.closest(".th");
    if (th) { const sec = th.parentElement; setOpen(sec, th.getAttribute("aria-expanded") !== "true"); saveOpen(); return; }
    const a = e.target.closest(".it a");
    if (a) { e.preventDefault(); go(+a.closest(".it").dataset.i, true); }
  });
  function saveOpen() { store.set("imap:open", [...document.querySelectorAll('.th[aria-expanded="true"]')].map(b => b.parentElement.dataset.n)); }
  store.get("imap:open", ["1"]).forEach(n => { const s = document.getElementById("t" + n); if (s) setOpen(s, true); });
  $("#expandAll").addEventListener("click", () => {
    const secs = [...document.querySelectorAll(".topic")].filter(s => !s.classList.contains("hidden-by-filter"));
    const open = !secs.every(s => s.querySelector(".th").getAttribute("aria-expanded") === "true");
    secs.forEach(s => setOpen(s, open)); saveOpen();
  });

  /* ---------- filter and required-only ---------- */
  let reqOnly = store.get("imap:req", false);
  function applyFilter() {
    const q = $("#filter").value.trim().toLowerCase();
    $("#reqOnly").setAttribute("aria-pressed", reqOnly);
    document.querySelectorAll(".topic").forEach(sec => {
      const T = DATA.topics.find(t => String(t.n) === sec.dataset.n);
      const hideTopic = reqOnly && !T.required;
      const topicHit = !q || (T.title + " " + T.keys.join(" ")).toLowerCase().includes(q);
      let any = false;
      sec.querySelectorAll(".it").forEach(li => {
        const hit = topicHit || items[li.dataset.i].label.toLowerCase().includes(q);
        li.classList.toggle("hidden-by-filter", !hit); if (hit) any = true;
      });
      sec.querySelectorAll(".grp").forEach(gp => {
        const ul = gp.nextElementSibling;
        gp.classList.toggle("hidden-by-filter", ![...ul.children].some(li => !li.classList.contains("hidden-by-filter")));
      });
      sec.classList.toggle("hidden-by-filter", hideTopic || !any);
      if (q && any && !hideTopic) setOpen(sec, true);
    });
    document.querySelectorAll(".band.extras").forEach(b => b.classList.toggle("hidden-by-filter", reqOnly));
    document.querySelector(".final").classList.toggle("hidden-by-filter", reqOnly);
    if (!q) document.querySelectorAll(".final .it").forEach(li => li.classList.remove("hidden-by-filter"));
    else document.querySelectorAll(".final .it").forEach(li => li.classList.toggle("hidden-by-filter", !items[li.dataset.i].label.toLowerCase().includes(q)));
  }
  $("#filter").addEventListener("input", applyFilter);
  $("#reqOnly").addEventListener("click", () => { reqOnly = !reqOnly; store.set("imap:req", reqOnly); applyFilter(); });

  /* ---------- the reader ---------- */
  const frame = $("#frame");
  let cur = -1, loaded = false;
  function crumb(i) {
    const it = items[i];
    $("#crumb").innerHTML = '<span class="cn">' + esc(it.topic.n) + "</span>" + esc(it.topic.title) + " › <b>" + esc(it.label) + "</b>";
    $("#openFull").href = "./#" + it.id;
  }
  function mark(i) {
    document.querySelectorAll(".it.on").forEach(li => li.classList.remove("on"));
    document.querySelectorAll(".topic.cur").forEach(s => s.classList.remove("cur"));
    cur = i;
    if (i < 0) return;
    const li = document.querySelector('.it[data-i="' + i + '"]');
    li.classList.add("on");
    const sec = li.closest(".topic");
    if (sec) { sec.classList.add("cur"); if (sec.querySelector(".tb").hidden) { setOpen(sec, true); saveOpen(); } }
    li.scrollIntoView({ block: "nearest" });
    crumb(i);
    $("#tick").setAttribute("aria-pressed", !!done[items[i].id]);
  }
  // the handbook scrolls to the target itself; this is a fallback for when it hasn't (e.g. rAF throttled)
  function reveal(id) {
    setTimeout(() => {
      try {
        const t = frame.contentDocument.getElementById(id);
        if (t && Math.abs(t.getBoundingClientRect().top) > 60) t.scrollIntoView({ block: "start", behavior: "instant" });
      } catch (e) {}
    }, 400);
  }
  function go(i, user) {
    if (i < 0 || i >= items.length) return;
    mark(i);
    const id = items[i].id;
    history.replaceState(null, "", "#" + id);
    store.set("imap:last", id);
    if (!loaded) { frame.src = "./?embed=1#" + id; }
    else {
      const w = frame.contentWindow;
      if (w.location.hash === "#" + id) { const t = w.document.getElementById(id); if (t) t.scrollIntoView({ block: "start" }); }
      else w.location.hash = id;
      reveal(id);
    }
    if (user && matchMedia("(max-width:860px)").matches) document.body.classList.remove("open");
  }
  frame.addEventListener("load", () => {
    loaded = true; $("#loading").hidden = true;
    if (cur >= 0) reveal(items[cur].id);
    const w = frame.contentWindow;
    const t = store.get("ct:theme", null);
    if (t) w.document.documentElement.setAttribute("data-theme", t);
    // links followed inside the handbook: highlight the matching map entry if there is one
    w.addEventListener("hashchange", () => {
      const id = w.location.hash.slice(1);
      const i = items.findIndex(x => x.id === id);
      if (i >= 0 && i !== cur) { mark(i); history.replaceState(null, "", "#" + id); }
      else if (i < 0) $("#crumb").innerHTML = "<b>" + esc(w.document.title.replace(/ · Career Tracks Handbook$/, "")) + "</b>";
    });
  });
  $("#prev").addEventListener("click", () => go(Math.max(cur - 1, 0), true));
  $("#next").addEventListener("click", () => go(Math.min(cur + 1, items.length - 1), true));
  $("#tick").addEventListener("click", () => { if (cur >= 0) toggleDone(items[cur].id); });
  $("#menu").addEventListener("click", e => { e.stopPropagation(); document.body.classList.toggle("open"); });
  $(".view").addEventListener("click", () => document.body.classList.remove("open"));
  $("#quizLink").addEventListener("click", e => {
    e.preventDefault(); mark(-1);
    $("#crumb").innerHTML = "<b>Self-test: network track</b>";
    if (!loaded) frame.src = "./?embed=1#quiz"; else frame.contentWindow.location.hash = "quiz";
  });

  document.addEventListener("keydown", e => {
    const tgt = e.target;
    if ((tgt.matches && tgt.matches("input, textarea")) || e.ctrlKey || e.metaKey || e.altKey) {
      if (e.key === "Escape" && tgt.id === "filter") { e.target.value = ""; applyFilter(); e.target.blur(); }
      return;
    }
    if (e.key === "j" || e.key === "]") { go(Math.min(cur + 1, items.length - 1), true); e.preventDefault(); }
    else if (e.key === "k" || e.key === "[") { go(Math.max(cur - 1, 0), true); e.preventDefault(); }
    else if (e.key === "x" && cur >= 0) { toggleDone(items[cur].id); }
    else if (e.key === "/") { e.preventDefault(); $("#filter").focus(); }
  });

  /* ---------- start ---------- */
  applyFilter(); paintTicks();
  const want = location.hash.slice(1) || store.get("imap:last", items[0].id);
  let start = items.findIndex(x => x.id === want);
  if (start < 0) start = 0;
  go(start, false);
})();
</script>
</body>
</html>
